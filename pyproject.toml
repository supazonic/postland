[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postland"
version = "0.1.0"
description = "Land records from any source (APIs today; databases, files, SFTP tomorrow) into typed PostgreSQL tables."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary]>=3.1",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
